name: Microsoft OneNote
website: https://www.microsoft.com/en-us/microsoft-365/onenote/digital-note-taking-app
description: Microsoft's free-form notes app, with handwriting and notebooks kept in your OneDrive, and apps for Windows, Mac, the web, Android and iOS.
deployment: cloud
platforms: [windows, macos, web, android, ios]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/7e/25/5e/7e255e92-95ec-8e1b-40df-07200024e09c/AppIcon-0-0-1x_U007epad-0-1-0-sRGB-0-0-0-85-220.png/128x128bb.png
aliases: [onenote 2016, onenote for windows 10, one note]

export:
  - id: web-notebook
    name: Export a notebook from OneNote for the web
    method: file
    formats: [onenote-web-zip]
    requirements: [Personal Microsoft account]
    steps:
      - In a browser, open OneNote for the web and right-click the notebook you want.
      - Select Export notebook. The pop-up shows how big it is, so check you've got the space, then select Export.
      - It downloads as a zip, with a folder named after the notebook inside.
    data:
      included: [text, formatting, attachments, drawings, structure, links, tags, dates, todos]
      excluded: [sharing, settings]
      unknown: [history, embeds]
    limitations:
      - It only works for notebooks in a personal OneDrive, not a work or school one or SharePoint.
      - It's one notebook at a time. A download that stops when you run out of space has to start again, and one that's too big has to be split into smaller notebooks first.
      - If the zip only holds an errors.txt, the export failed, and that file says why.
    docs: https://support.microsoft.com/en-us/onenote/export-and-import-onenote-notebooks

  - id: windows-files
    name: Export OneNote files from OneNote for Windows
    method: file
    formats: [onenote]
    requirements: [OneNote for Windows]
    steps:
      - Open the notebook and go to File --> Export.
      - Under Export Current pick Notebook, then pick OneNote Package (*.onepkg) as the format and select Export.
      - For a single section, pick Section and OneNote 2010-2016 Section instead.
    data:
      included: [text, formatting, attachments, drawings, structure, links, tags, dates, todos]
      excluded: [sharing, settings]
      unknown: [history, embeds]
    limitations:
      - Only the desktop app for Windows exports these, not OneNote for Mac, the web or the old OneNote for Windows 10.
      - Password-protected sections stay locked inside the file, and the apps that read it skip them. Take the password off first.
    docs: https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/export-notes-from-onenote-as-a-pdf
    sources:
      - https://github.com/obsidianmd/obsidian-help/blob/ced32050c0d9d1e1f8d3faa19a8ba8474d75a32d/en/Import%20notes/Import%20from%20Microsoft%20OneNote.md
      - https://learn.microsoft.com/en-us/openspecs/office_file_formats/ms-onestore/ae670cd2-4b38-4b24-82d1-87cfb2cc3725

  - id: backup
    name: Back up every notebook from OneNote for Windows
    method: file
    formats: [onenote]
    requirements: [OneNote for Windows]
    steps:
      - Go to File --> Options and choose Save & Backup.
      - Select Back Up All Notebooks Now, then OK once it's done.
      - The .one files are in the Backup Folder shown there, which starts out as %LOCALAPPDATA%\Microsoft\OneNote\16.0\Backup.
    data:
      included: [text, formatting, attachments, drawings, structure, links, tags, dates, todos]
      excluded: [sharing, settings]
      unknown: [history, embeds]
    limitations:
      - It takes every notebook in one go, rather than one at a time.
      - Password-protected sections stay locked in the backup too.
    docs: https://support.microsoft.com/en-us/onenote/back-up-notes
    sources:
      - https://github.com/obsidianmd/obsidian-help/blob/ced32050c0d9d1e1f8d3faa19a8ba8474d75a32d/en/Import%20notes/Import%20from%20Microsoft%20OneNote.md

  - id: pdf
    name: Export pages as a PDF
    method: file
    formats: [pdf]
    steps:
      - In OneNote for Windows, go to File --> Export, pick Page, Section or Notebook under Export Current, then PDF (*.pdf).
      - On a Mac, go to File --> Save as PDF, which saves the page you're on.
      - In OneNote for the web, it's File --> Print, or File --> Export as PDF in a browser on a Mac, one page at a time.
    data:
      included: [text, formatting]
      excluded: [history, sharing, settings]
      unknown: [attachments, drawings]
    limitations:
      - It's a snapshot of how the pages look, so you can read it anywhere but it won't come back in as notes.
    docs: https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/export-notes-from-onenote-as-a-pdf
    sources:
      - https://support.microsoft.com/en-us/onenote/onenote-for-mac-help-and-learning/export-notes-as-a-pdf-file-in-onenote-for-mac
      - https://support.microsoft.com/en-us/onenote/onenote-for-web-help-and-learning/export-notes-as-a-pdf-in-onenote-for-the-web

  - id: word
    name: Export a page or section as a Word document
    method: file
    formats: [docx]
    requirements: [OneNote for Windows]
    steps:
      - Go to File --> Export and pick Page or Section under Export Current.
      - Pick Word Document (*.docx) as the format and select Export.
    data:
      included: [text]
      unknown: [formatting, attachments, drawings]
    limitations:
      - It won't export a whole notebook to Word, only a page or a section at a time.
    docs: https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/export-notes-from-onenote-as-a-pdf
    sources:
      - https://mc.merill.net/message/MC1104312

import:
  - id: web-notebook
    name: Open a downloaded notebook
    method: file
    formats: [onenote-web-zip]
    requirements: [OneNote for Windows]
    steps:
      - Unzip the notebook you exported from OneNote for the web, or downloaded as a folder from OneDrive.
      - On a Windows PC, open the OneNote app and double-click the file called OneNote Table of Contents in that folder.
    limitations:
      - OneNote for the web's own notebook import has been retired, so this only works in the Windows app.
      - Microsoft's own Evernote importer was retired in September 2022.
    docs: https://support.microsoft.com/en-us/onenote/export-and-import-onenote-notebooks
    sources:
      - https://support.microsoft.com/en-us/office/making-the-move-from-evernote-to-onenote-aa00ec78-229d-4012-a9cd-9b015e89d516

delete:
  steps:
    - In OneDrive, find the notebook, usually in a folder called Notebooks or OneNote Notebooks, select it and select Delete.
    - In OneNote for Windows, right-click it in your notebook list and select Close this Notebook, so it stops trying to sync.
    - To close a personal Microsoft account as well, sign in, work through Microsoft's closure checklist and select Mark account for closure.
  docs: https://support.microsoft.com/en-us/onenote/onenote-help-and-learning/delete-a-onenote-notebook
  notes:
    - Tell anyone you've shared the notebook with first, since it goes for them too.
    - Deleted notebooks sit in OneDrive's recycle bin for 30 days on a personal account, or 93 on a work or school one, unless you empty it.
    - A closed account can be reopened for 30 or 60 days, whichever you pick, and Microsoft deletes your data after that.

