name: Trilium Notes
website: https://triliumnotes.org/
description: An open source app for building a big tree of notes, kept in a database on your computer or on a server you run yourself.
deployment: local
platforms: [windows, macos, linux, web]
source: https://github.com/TriliumNext/Trilium
aliases: [trilium, triliumnext, trilium next]

export:
  - id: html
    name: Export a branch as HTML
    method: file
    formats: [html]
    steps:
      - Right-click the top note of what you want in the tree and choose Export...
      - Under What to export pick This note & all descendants, then pick HTML under Format.
      - Select Export to save a zip with an HTML file for each note and a folder for each note with children.
    data:
      included: [text, formatting, attachments, structure, links, dates, todos, canvases]
      excluded: [properties, history, sharing, settings]
      unknown: [embeds]
    limitations:
      - Labels and relations are only in the zip's !!!meta.json, which only Trilium reads.
      - Only each note's modified date comes out, as the file's date. Created dates and revisions are only in a database backup (Options --> Backup --> Backup now), which only Trilium opens.
      - Protected notes only come out if you've unlocked them first, and then they're in plain text. Otherwise you get an empty note called [protected].
      - Links to notes outside the branch won't work, and a note in two places comes out once, with a stub pointing to it from the other.
      - Canvases come out as an SVG picture plus their drawing data in JSON.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/export/zip.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/apps/client/src/widgets/dialogs/export.tsx

  - id: markdown
    name: Export a branch as Markdown
    method: file
    formats: [markdown]
    steps:
      - Right-click the top note of what you want in the tree and choose Export...
      - Under What to export pick This note & all descendants, then pick Markdown under Format.
      - Select Export to save a zip with a .md file for each note and a folder for each note with children.
    data:
      included: [text, formatting, attachments, structure, links, dates, todos, canvases]
      excluded: [properties, history, sharing, settings]
      unknown: [embeds]
    limitations:
      - In text notes, links between notes and pictures stay as HTML tags inside the Markdown, which some apps won't treat as links.
      - Each file starts with the note's title as a heading. There's no front matter, so labels and relations are only in the zip's !!!meta.json.
      - Only each note's modified date comes out, as the file's date.
      - Protected notes only come out if you've unlocked them first, and then they're in plain text.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/markdown
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/export/markdown.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/export/zip/markdown.ts

  - id: opml
    name: Export a branch as an OPML outline
    method: file
    formats: [opml]
    steps:
      - Right-click the top note of what you want in the tree and choose Export...
      - Pick This note & all descendants, then OPML under Format, and select Export.
    data:
      included: [text, formatting, structure]
      excluded: [attachments, properties, dates, history, sharing, settings]
      unknown: [links, todos]
    limitations:
      - Each note's text goes in as HTML inside the outline, and images and attachments are left out.
      - A note in two places comes out twice.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/export/opml.ts

  - id: pdf
    name: Export a note to PDF
    method: file
    formats: [pdf]
    requirements: [Desktop app]
    steps:
      - Open the note, then choose Print/export to PDF... from its More actions menu (⋯).
      - Under Destination pick Save as PDF and save it.
    data:
      included: [text, formatting]
      unknown: [attachments, links]
    limitations:
      - It works one note at a time, or on a collection's notes. In the web version it's your browser's print dialog instead.
    docs: https://docs.triliumnotes.org/user-guide/concepts/notes/printing-and-pdf-export

import:
  - id: files
    name: Import Markdown, HTML or OPML files
    method: file
    formats: [markdown, markdown-frontmatter, html, txt, opml]
    steps:
      - Right-click the note to import into and choose Import into note...
      - Leave Files & other formats picked, choose the files or a zip of them and select Import.
    data:
      included: [text, formatting, attachments, structure, links, tags, properties, todos]
      excluded: [dates, databases, canvases, plugins, settings]
    limitations:
      - A zip's folders become the note tree, and relative links and images between its files are connected up.
      - Front matter turns into labels, one for each key and one per item in a list, so each tag becomes a tags label. Nested values are dropped.
      - "[[Wiki links]] become links to a path of the same name, which is then looked for in the zip, so they may not connect up. For an Obsidian vault, use the Obsidian import."
      - Files imported on their own, rather than in a zip, don't get their links connected.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/markdown
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/zip.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/single.ts

  - id: notion
    name: Import from Notion
    method: file
    formats: [notion-html]
    steps:
      - In Notion, export the workspace or a page as HTML, with Include subpages and Create folders for subpages on.
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Notion under Import from.
      - Choose the .zip and select Import.
    data:
      included: [text, formatting, attachments, structure, links, properties, databases, todos]
      excluded: [comments, history, sharing]
      unknown: [dates, embeds]
    limitations:
      - It won't take a Markdown & CSV export. It has to be HTML.
      - Every database becomes a table, whatever its view, and its columns become labels. Formulas and rollups come in as fixed values, and buttons are dropped.
      - Created and edited dates only come across from Created time and Last edited time properties. Otherwise notes are dated the day you import.
      - Page icons and covers are dropped, and so are files no page links to.
      - Relations to pages that weren't in the export are dropped.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/notion
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/notion/importer.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/notion/converter.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/notion/collection.ts

  - id: obsidian
    name: Import from Obsidian
    method: file
    formats: [markdown, markdown-frontmatter]
    from: [obsidian]
    steps:
      - Zip up your Obsidian vault folder.
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Obsidian under Import from.
      - Choose the .zip and select Import.
    data:
      included: [text, formatting, attachments, structure, links, tags, properties, embeds]
      excluded: [databases, canvases, plugins, settings]
      unknown: [dates]
    limitations:
      - It takes a zip of the vault, not the folder itself.
      - Canvases and bases are dropped, along with embeds of them and any folder whose name starts with a dot.
      - Tags in the front matter become labels, so project/alpha becomes #projectAlpha. Tags typed in the text stay as text.
      - Links to a heading or block just go to the note, and Markdown-style [text](note.md) links aren't connected up.
      - Callouts become one of Trilium's five admonition types, and lose their folding.
      - Both dates come from each file's time in the zip, which might just be when you made the zip.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/obsidian
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/obsidian/importer.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/obsidian/links.ts

  - id: evernote
    name: Import from Evernote
    method: file
    formats: [enex]
    steps:
      - In Evernote, export each notebook as an ENEX file.
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Evernote under Import from.
      - Choose one or more .enex files and select Import.
    data:
      included: [text, formatting, attachments, links, tags, properties, dates, todos]
    limitations:
      - Each .enex file becomes a note named after the file, with its notes inside.
      - Links between notes only work within one file, so links to another notebook stay as evernote:// links.
      - A note with no title stops the rest of its file importing.
      - Fonts and font sizes are dropped, and so are task due dates and assignees.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/evernote
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/enex.ts

  - id: google-keep
    name: Import from Google Keep
    method: file
    formats: [google-keep-takeout]
    steps:
      - Export Keep from Google Takeout, on its own, and download the zip.
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Google Keep under Import from.
      - Choose the zip and select Import.
    data:
      included: [text, formatting, attachments, drawings, dates, todos]
      excluded: [tags, properties, sharing]
    limitations:
      - Labels, pins and archived or trashed status are dropped, so archived and trashed notes come in like any other. Colours come across as labels.
      - Every note lands flat under one Google Keep import note.
      - Checklists lose their indents, and empty items are dropped.
      - Any other JSON file in the zip gets imported as a note too, so leave the other Google products out of the Takeout.
      - Reminders and collaborators aren't imported.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/keep
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/keep/importer.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/keep/converter.ts

  - id: onenote
    name: Import from OneNote with a Microsoft account
    method: connect
    from: [onenote]
    steps:
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Microsoft OneNote under Import from.
      - Select Sign in with Microsoft and sign in. On the web version, open the sign-in page and enter the code it shows.
      - Tick the sections you want and select Import selected.
    data:
      included: [text, formatting, attachments, drawings, structure, links, dates, todos]
      excluded: [tags, history, sharing]
      unknown: [embeds]
    limitations:
      - Only notebooks in your own OneDrive show up, not ones shared with you or kept on SharePoint or Teams.
      - To Do tags become checkboxes, and about 20 of OneNote's built-in tags become an icon in front of the text. Other tags are dropped.
      - Handwriting comes in as one SVG image at the end of each page.
      - Password-protected sections come in as placeholder notes without their pages, so take the lock off first.
      - Sections and section groups come in sorted by when they were made, not in your order.
      - Nothing's saved until the end, so an import that's stopped part way keeps nothing.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/onenote
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/apps/server/src/services/import/onenote/importer.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/apps/server/src/services/import/onenote/converter.ts

  - id: anytype
    name: Import from Anytype
    method: file
    formats: [anytype-json]
    steps:
      - In Anytype, export the space with the Any-Block format and JSON selected.
      - In Trilium, right-click a note in the tree, choose Import into note... and pick Anytype under Import from.
      - Choose the .zip and select Import.
    data:
      included: [text, formatting, attachments, links, properties, databases, dates, todos, embeds]
      excluded: [tags]
    limitations:
      - Only pages and collections come in. Sets, tasks, notes and bookmark objects are skipped.
      - Anytype's own Tag and Description properties are dropped, and so are properties that link to other objects. Only properties you made yourself come across.
      - Everything lands under one Anytype import note, with collections as list, grid, board, calendar or table views from their first view.
    docs: https://docs.triliumnotes.org/user-guide/concepts/import-export/import-from-apps/anytype
    sources:
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/anytype/importer.ts
      - https://github.com/TriliumNext/Trilium/blob/v0.107.0/packages/trilium-core/src/services/import/anytype/collection.ts

verification:
  status: documented
  checked_at: 2026-11-22
