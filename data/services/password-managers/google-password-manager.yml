name: Google Password Manager
website: https://passwords.google.com/
description: Google's password manager, built into Chrome and Android. Your passwords and passkeys are saved to your Google Account and sync wherever you sign in.
deployment: cloud
platforms: [android, ios, windows, macos, linux, web]
icon: https://www.gstatic.com/images/branding/product/2x/password_manager_96dp.png
aliases: [Chrome passwords, Google passwords]

export:
  - id: csv
    name: Export your passwords as CSV
    method: file
    formats: [chrome-csv]
    steps:
      - In Chrome on a computer, select ⋮ --> Passwords and autofill --> Google Password Manager, then Settings on the left.
      - Next to Export passwords, select Download file and confirm it's you if asked.
      - On Android, it's Chrome's Settings --> Autofill and passwords --> Google Password Manager --> Settings --> Export passwords & passkeys.
      - On iPhone, tap Settings --> Export data in Chrome's Password Manager, pick the accounts, tap Continue, then Download to CSV.
    data:
      included: [logins]
      excluded: [passkeys, dates, settings]
    limitations:
      - Passkeys never go in it. On a computer, each one still gets a row with its site and username but no password.
      - Logins for Android apps come out with an android:// address, and a login Google links to several sites gets a row for each.
      - There are no dates, and the sites you've told it never to save for aren't in it.
      - Logins that use Sign in with Google come out as rows with no password.
      - It isn't encrypted, so delete it once you've imported it.
      - On Android and iPhone, you can also hand your passwords and passkeys straight to an app that supports Credential Exchange, with no file. On Android, you start that in the other app.
    docs: https://support.google.com/chrome/answer/13068232
    sources:
      - https://support.google.com/chrome/answer/95606
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/components/password_manager/core/browser/export/password_csv_writer.cc
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/components/password_manager/core/browser/export/password_manager_exporter.cc
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/ios/chrome/browser/credential_exchange/ui/credential_export_view_controller.mm

import:
  - id: google-csv
    name: Import a Chrome or Google Password Manager .csv
    method: file
    formats: [chrome-csv]
    steps:
      - In Chrome on a computer, open Google Password Manager --> Settings and select Select file under Import passwords.
      - At passwords.google.com, it's Settings --> Import --> Select file. On Android, tap Settings --> Import passwords in Google Password Manager.
      - Choose the .csv, select Import and follow what's on screen.
    data:
      included: [logins]
    limitations:
      - A file with over 3,000 passwords is turned away whole, so split it up. It holds 10,000 in all, and Chrome won't take a file over 1,000 KB.
      - Rows with no password, no proper web address, an address over 2,048 characters, or a username, password or note over 1,000 are skipped, and Chrome lists them.
      - A login it already has stays as it is, with the file's note added. One with a different password shows as a conflict you can replace, and keeps its own note.
      - On Android, Settings --> Import passwords and passkeys brings them straight from an app that supports Credential Exchange. On iPhone, you start in the other app and pick Chrome.
    docs: https://support.google.com/chrome/answer/13068232
    sources:
      - https://support.google.com/accounts/answer/10500247
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/components/password_manager/core/browser/import/password_importer.cc
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/components/password_manager/core/common/password_manager_constants.h

  - id: csv
    name: Import any CSV with url, username and password columns
    method: file
    formats: [csv]
    steps:
      - Open the .csv and check its first line has columns called url, username and password. Rename any that are called something else.
      - Import it from Google Password Manager --> Settings in Chrome, or Settings --> Import --> Select file at passwords.google.com.
    data:
      included: [logins]
    limitations:
      - Chrome also takes website, origin, hostname or login_uri for the address, user, login, account or login_username for the username, and login_password. Case doesn't matter.
      - A note, notes, comment or comments column comes in as each login's note, and every other column's ignored.
      - A file with over 3,000 passwords is turned away whole, and rows with no password or no proper web address are skipped.
    docs: https://support.google.com/accounts/answer/10500247
    sources:
      - https://chromium.googlesource.com/chromium/src/+/refs/tags/158.0.8127.89/components/password_manager/core/browser/import/csv_password_sequence.cc

delete:
  steps:
    - In Chrome on a computer, open Google Password Manager --> Settings, then select Delete data next to Delete all Google Password Manager data.
    - On Android, tap Settings --> Delete all data in Google Password Manager. On iPhone, tap Settings --> Delete All Data in Password Manager.
    - Select Delete to confirm.
  docs: https://support.google.com/chrome/answer/95606
  notes:
    - It deletes every password and passkey saved in Google Password Manager. Google doesn't say how long they take to go from its own systems.
    - To close the whole Google Account, go to Data & privacy in your Google Account and select More options --> Delete your Google Account. Gmail, Drive and the rest go with it.
    - Uninstalling the Passwords app on Android doesn't delete anything, since it's only a shortcut.

