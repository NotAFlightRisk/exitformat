name: 1Password
website: https://1password.com/
description: Subscription password manager for every platform. Your vaults are end-to-end encrypted and synced through 1Password's cloud.
deployment: cloud
platforms: [android, ios, windows, macos, linux, web, browser-extension]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/14/01/62/1401623d-42a9-93a0-eba7-ec295915a35b/AppIcon-0-0-1x_U007epad-0-8-0-P3-85-220.png/128x128bb.png
aliases: [one password, onepassword]

export:
  - id: 1pux
    name: Export everything as 1PUX
    method: file
    formats: [1password-1pux]
    requirements: [1Password 8 for Mac, Windows or Linux]
    steps:
      - On Mac, select File --> Export in the menu bar. On Windows or Linux, select the ellipsis at the top of the sidebar, then Export.
      - Choose the account you want to export and enter your account password.
      - Choose 1PUX as the export format, then select Export Data.
      - Pick where to save it and select Open (OK on Linux).
    data:
      included:
        [
          logins,
          secrets,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          attachments,
          tags,
          shared-vaults,
          history,
          favourites,
          dates
        ]
      excluded: [passkeys, settings]
    limitations:
      - It isn't encrypted, so delete it once you've imported it.
      - Archived items come out too, marked as archived.
      - Passkeys are left out. Only the phone apps can hand them to another app, through Credential Exchange.
      - Shared vaults come out with everything in them, but not who they're shared with.
      - In a business account, you need the Export Items permission on a vault to export it.
      - Only the desktop apps make a file. On iOS 26 or later, Settings --> Advanced --> Start Export hands a copy to an app that supports Credential Exchange, and on Android 14 you start that from the other app.
    docs: https://support.1password.com/export/
    sources:
      - https://support.1password.com/1pux-format/
      - https://releases.1password.com/mac/stable/8.10.12/
      - https://releases.1password.com/mac/stable/8.10.18/
      - https://releases.1password.com/windows/stable/8.5.0/
      - https://github.com/aliasvault/aliasvault/blob/0e5156d81b42629a8ac673f38e0c57172117e98b/core/client/src/transfer/import/importers/onepassword/__tests__/1password.1pux

  - id: csv
    name: Export logins as CSV
    method: file
    formats: [1password-csv]
    requirements: [1Password 8 for Mac, Windows or Linux]
    steps:
      - On Mac, select File --> Export in the menu bar. On Windows or Linux, select the ellipsis at the top of the sidebar, then Export.
      - Choose the account you want to export and enter your account password.
      - Choose CSV as the export format, then select Export Data.
      - Pick where to save it and select Open (OK on Linux).
    data:
      included: [logins, secrets, tags, favourites]
      excluded:
        [
          passkeys,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          attachments,
          shared-vaults,
          history,
          dates,
          settings
        ]
    limitations:
      - Only Login and Password items go in, without custom fields, security questions or linked apps. Everything else needs the 1PUX.
      - There's one website column, so a login with several only brings one, and nothing says which vault it came from.
      - Archived items come out too, with Archived set.
      - It isn't encrypted, so delete it once you've imported it.
    docs: https://support.1password.com/export/
    sources:
      - https://github.com/aliasvault/aliasvault/blob/0e5156d81b42629a8ac673f38e0c57172117e98b/core/client/src/transfer/import/importers/onepassword/__tests__/1password.csv

import:
  - id: 1pux
    name: Import a 1PUX file
    method: file
    formats: [1password-1pux]
    steps:
      - On Mac, select File --> Import in the menu bar. On Windows or Linux, select the ellipsis at the top of the sidebar, then Import.
      - On a phone, tap the plus button (New Item on Android), then Migrate data into 1Password.
      - Select 1Password, then Add File, and pick the .1pux. On a phone, tap Upload a 1PUX file instead first.
      - Choose the account to import into and select Import.
    limitations:
      - Without permission to create vaults in a team or business account, only the items from your Personal, Private or Employee vault come in.
    docs: https://support.1password.com/import/
    sources:
      - https://releases.1password.com/mac/stable/8.12.10/

  - id: bitwarden
    name: Import a Bitwarden encrypted export
    method: file
    formats: [bitwarden-encrypted-json]
    steps:
      - In Bitwarden's web vault, export with .json (Encrypted) as the File format and Password protected, then set a password.
      - On Mac, select File --> Import in the menu bar. On Windows or Linux, select New Item --> Migrate data into 1Password.
      - Select Bitwarden, choose a vault, then select Add File, pick the export and paste its password.
      - Select Import. On a phone, start from the plus button (New Item on Android), and on 1Password.com from your name --> Import data.
    data:
      included: [logins, secure-notes, cards, identities]
      excluded: [passkeys, shared-vaults]
      unknown: [secrets, other-items, custom-fields, groups, history, favourites, dates]
    limitations:
      - The plain .json and Account restricted exports don't work, so pick Password protected.
      - It fails if your Bitwarden account uses Argon2id, so switch its KDF algorithm to PBKDF2 and export again.
      - Passkeys and items in shared collections are left behind.
      - On a phone, Bitwarden can hand your vault over with Credential Exchange instead, passkeys too. On iOS 26 you start in Bitwarden, and on Android 14 in 1Password.
    docs: https://support.1password.com/import-bitwarden/
    sources:
      - https://releases.1password.com/mac/stable/8.10.76/
      - https://releases.1password.com/mac/stable/8.12.0/
      - https://releases.1password.com/ios/stable/8.12.36/

  - id: bitwarden-csv
    name: Import a Bitwarden .csv export
    method: file
    formats: [bitwarden-csv]
    steps:
      - Export your vault from Bitwarden with .csv as the File format.
      - On Mac, select File --> Import in the menu bar. On Windows or Linux, select New Item --> Migrate data into 1Password.
      - Select Bitwarden, choose a vault, then select Add File and pick the .csv.
      - Select Import. On a phone, start from the plus button (New Item on Android), then Migrate data into 1Password.
    data:
      included: [logins]
      unknown: [secrets, secure-notes, custom-fields, groups, favourites]
    limitations:
      - Only the apps take a .csv. 1Password.com wants the password protected .json.
    docs: https://support.1password.com/import-bitwarden/
    sources:
      - https://releases.1password.com/mac/stable/8.12.21/

  - id: lastpass
    name: Import from LastPass
    method: connect
    from: [lastpass]
    requirements: [1Password for Mac, Windows or Linux]
    steps:
      - On Mac, select File --> Import --> LastPass. On Windows or Linux, select the ellipsis, then Import --> LastPass.
      - Enter your LastPass account details, pick the 1Password account to import into, then select Next.
      - Select Import.
    data:
      included:
        [
          logins,
          secrets,
          secure-notes,
          cards,
          identities,
          other-items,
          attachments,
          groups,
          shared-vaults
        ]
      excluded: [passkeys]
      unknown: [custom-fields, history, favourites, dates]
    limitations:
      - Private folders become tags. Shared folders become vaults with their permissions, but only when an admin of the folder imports them.
      - Passkeys and the codes in LastPass Authenticator are left behind, and only shared items keep their password history.
      - Your LastPass account settings and other metadata land in an Imported Unknown Data vault as secure notes.
      - If you sign in to LastPass with SMS codes, switch to another two-factor method first. Some SSO setups need the .csv import on 1Password.com instead.
    docs: https://support.1password.com/import-lastpass/

  - id: lastpass-csv
    name: Import a LastPass export
    method: file
    formats: [lastpass-csv]
    steps:
      - In LastPass's web vault, select Advanced options --> Export, confirm from the email it sends, then export again.
      - Sign in to 1Password.com, select your name in the top right, then Import --> LastPass.
      - Choose a vault, select inside the dotted rectangle and pick the .csv.
      - Select Import.
    data:
      included: [logins, secure-notes, other-items]
      excluded: [secrets, passkeys, attachments, groups]
      unknown: [cards, identities, custom-fields, favourites, shared-vaults]
    limitations:
      - Folders become tags. Form Fills, one-time codes, passkeys and attachments are left behind.
      - Other item types, like SSH keys and insurance policies, come in as secure notes.
      - Turn off Import items in shared folders to bring in only your own items.
    docs: https://support.1password.com/cs/import-lastpass-web/

  - id: chrome
    name: Import from Chrome
    method: file
    formats: [chrome-csv]
    steps:
      - In Chrome, open Passwords and Autofill --> Google Password Manager --> Settings and select Download file.
      - On Mac, select File --> Import in the menu bar. On Windows or Linux, select the ellipsis at the top of the sidebar, then Import.
      - Select Chrome, then Add File, pick the .csv, choose the account to import into and select Import.
      - On a phone, start from the plus button (New Item on Android). On 1Password.com, it's your name --> Import data --> Chrome.
    data:
      included: [logins]
    limitations:
      - Cards, addresses and passkeys saved in Chrome don't come across, so add those by hand.
      - Edge and Brave's .csv files go in through the CSV import on 1Password.com instead.
    docs: https://support.1password.com/import-chrome/

  - id: safari
    name: Import from Apple Passwords or Safari
    method: file
    formats: [apple-passwords-csv]
    steps:
      - Export your passwords from Apple's Passwords app or Safari, then unzip the file you get.
      - On Mac, select File --> Import in the menu bar. On Windows or Linux, select the ellipsis at the top of the sidebar, then Import.
      - Select Safari, then Add File, and pick the .csv. On a phone, tap Upload a CSV file instead first.
      - Choose the vault to import into and select Import. On 1Password.com, it's your name --> Import data --> Safari.
    data:
      included: [logins]
      unknown: [secrets]
    limitations:
      - Cards, addresses and passkeys don't come across.
      - On iOS 26 or later, Export Data to Another App in the Passwords app moves them to 1Password with no file.
    docs: https://support.1password.com/import-safari/

  - id: firefox
    name: Import from Firefox
    method: file
    formats: [firefox-csv]
    steps:
      - In Firefox, open Passwords from the menu, select the ellipsis in the top right, then Export Passwords.
      - Sign in to 1Password.com, select your name in the top right, then Import data.
      - Select Firefox and follow the onscreen steps.
    data:
      included: [logins]
    docs: https://support.1password.com/import-firefox/

  - id: dashlane
    name: Import a Dashlane export
    method: file
    formats: [dashlane-csv]
    steps:
      - In Dashlane's web app, select My account --> Export Data --> Export to CSV. You get a .zip.
      - Sign in to 1Password.com, select your name in the top right, then Import data.
      - Select Dashlane and follow the onscreen steps.
    data:
      included: [logins, secure-notes, cards, identities, other-items]
      excluded: [passkeys]
      unknown: [secrets, custom-fields, groups]
    limitations:
      - Passkeys are left behind.
      - On a phone, Dashlane can hand your vault straight to 1Password with Credential Exchange instead.
    docs: https://support.1password.com/import-dashlane/

  - id: keepass
    name: Import a KeePass XML export
    method: file
    formats: [keepass-xml]
    steps:
      - In KeePass 2, select File --> Export and pick KeePass XML (2.x).
      - Sign in to 1Password.com, select your name in the top right, then Import data.
      - Select KeePass and follow the onscreen steps. Do it once for each database.
    data:
      included: [logins]
      excluded: [secrets]
    limitations:
      - Only logins come across. One-time codes and everything else are left behind.
    docs: https://support.1password.com/import-keepass/

  - id: keepassxc
    name: Import a KeePassXC .csv export
    method: file
    formats: [keepassxc-csv]
    steps:
      - In KeePassXC, select Database --> Export --> CSV File and save it.
      - Sign in to 1Password.com, select your name in the top right, then Import data.
      - Select KeePassXC and follow the onscreen steps. Do it once for each database.
    data:
      included: [logins]
      excluded: [secrets]
    limitations:
      - Only logins come across. One-time codes and everything else are left behind.
    docs: https://support.1password.com/import-keepassxc/

  - id: roboform
    name: Import from RoboForm
    method: file
    formats: [roboform-csv]
    steps:
      - Export from RoboForm 8 or later as a CSV file. On Mac, it's File --> Export. On Windows, it's Options --> Account & Data --> Export.
      - Sign in to 1Password.com, select your name in the top right, then Import data.
      - Select RoboForm and follow the onscreen steps.
    data:
      included: [logins, secrets, secure-notes]
      excluded: [identities, other-items]
    limitations:
      - Safenotes become secure notes, and bookmarks become secure notes tagged Bookmark.
      - Identities and other items are left behind.
    docs: https://support.1password.com/import-roboform/

  - id: delinea
    name: Import from Delinea Secret Server
    method: file
    formats: [delinea-secret-server-xml]
    steps:
      - In Secret Server, select Admin --> See All, then Export / Import under Setup and System Maintenance.
      - Select Export on the Secrets tab, tick Export with Folder Path, Export Child Folders and Import with TOTP Settings, and pick XML.
      - Sign in to 1Password.com, select your name in the top right, then Import data --> Delinea Secret Server.
    data:
      included: [logins, cards, secure-notes, other-items]
      excluded: [groups, favourites]
      unknown: [secrets]
    limitations:
      - Folder names become tags, and contacts and other secret types come in as secure notes.
      - Favourites aren't kept.
    docs: https://support.1password.com/import-delinea/

  - id: csv
    name: Import a CSV file
    method: file
    formats: [csv]
    steps:
      - Tidy it so each row's a login, card or secure note, every row has the same number of fields, and rows of a type match.
      - Sign in to 1Password.com, select your name in the top right, then Import data --> CSV File.
      - Pick an item type for each row, then Add Label to each column (or Ignore Column) and select Continue.
    data:
      included: [logins, secure-notes, cards]
      unknown: [secrets, custom-fields, tags]
    limitations:
      - Each login needs a username, password and website, each card a number and expiry date, and each secure note a title.
      - Edge, Brave and Keeper exports go in this way. For Keeper's, move its otpauth links into a column of their own and label it one-time password.
    docs: https://support.1password.com/import-1password-com/
    sources:
      - https://support.1password.com/import-keeper/
      - https://support.1password.com/import-edge/

delete:
  steps:
    - Sign in to 1Password.com, select your name in the top right, then Manage Account.
    - Select Permanently Delete Account at the bottom of the page.
    - For a family account, select Settings in the sidebar, then Permanently Delete Family Account.
    - For a team, it's Settings, then Permanently Delete Account and All Team Members.
  docs: https://support.1password.com/delete-account/
  notes:
    - Everything's gone for good after 30 days, and until then 1Password Support may be able to restore the account.
    - Deleting a family or team account wipes everyone's data in it, not just yours.
    - For a business account, email businesssupport@1password.com instead.
    - Locked out? Enter your email at start.1password.com/support and select Request account recovery, and the email it sends lets you delete the account.

