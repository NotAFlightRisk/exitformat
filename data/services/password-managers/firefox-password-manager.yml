name: Firefox Password Manager
website: https://www.firefox.com/en-US/features/password-manager/
description: The password manager built into Firefox, at about:logins. Your passwords stay on the device, and sync end-to-end encrypted if you sign in to a Mozilla account.
deployment: local
platforms: [windows, macos, linux, android, ios]
source: https://github.com/mozilla-firefox/firefox
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/ca/84/a9/ca84a915-6a34-3c74-70b1-4da7c16c1e35/AppIcon-0-0-1x_U007epad-0-1-0-sRGB-85-220.png/128x128bb.png
aliases: [Firefox passwords, about:logins, Firefox Lockwise]

export:
  - id: csv
    name: Export your passwords as CSV
    method: file
    formats: [firefox-csv]
    requirements: [Firefox on a computer]
    steps:
      - Open Firefox's menu and select Passwords. The about:logins page opens in a new tab.
      - Select the ⋯ menu in its top right, then Export Passwords…, then Continue with export.
      - Enter your Primary Password or your computer's password if it asks, then pick where to save the .csv.
    data:
      included: [logins, dates]
      excluded: [settings]
    limitations:
      - It isn't encrypted, so delete it once you've imported it.
      - Each row also has when the login was made, last used and last changed, plus Firefox's own httpRealm, formActionOrigin and guid columns.
    docs: https://support.mozilla.org/kb/export-login-data-firefox
    sources:
      - https://web.archive.org/web/20260621011944/https://support.mozilla.org/en-US/kb/export-login-data-firefox
      - https://github.com/mozilla-firefox/firefox/blob/FIREFOX_159_0_1_RELEASE/toolkit/components/passwordmgr/LoginExport.sys.mjs
      - https://github.com/mozilla-firefox/firefox/blob/FIREFOX_159_0_1_RELEASE/browser/locales/en-US/browser/aboutLogins.ftl

import:
  - id: csv
    name: Import a CSV with url, username and password columns
    method: file
    formats: [firefox-csv, chrome-csv, apple-passwords-csv, bitwarden-csv, lastpass-csv, csv]
    requirements: [Firefox on a computer]
    steps:
      - Open Firefox's menu and select Passwords, then the ⋯ menu --> Import from a File….
      - Pick the .csv and select Open, then Done once it's finished.
      - Or go to Settings, select Import Data under Import Browser Data and pick Passwords from CSV file.
    data:
      included: [logins, dates]
    limitations:
      - The file needs columns called url (or login_uri), username (or login_username) and password (or login_password). Case doesn't matter, and a .tsv works too.
      - Firefox's own dates and guid columns come in as well. Every other column, notes and one-time codes included, is ignored.
      - Import from Another Browser… in the same menu brings passwords straight from another browser on the same computer.
    docs: https://support.mozilla.org/kb/import-login-data-file
    sources:
      - https://web.archive.org/web/20260722140304/https://support.mozilla.org/en-US/kb/import-login-data-file
      - https://github.com/mozilla-firefox/firefox/blob/FIREFOX_159_0_1_RELEASE/toolkit/components/passwordmgr/LoginCSVImport.sys.mjs

delete:
  steps:
    - Open Firefox's menu and select Passwords, then the ⋯ menu --> Remove All Passwords….
    - Tick Yes, remove passwords and select Remove All.
  docs: https://support.mozilla.org/kb/password-manager-remember-delete-edit-logins
  notes:
    - If you sync with a Mozilla account, it removes them from all your synced devices too. It can't be undone.
    - It removes any breach alerts for those logins as well.

verification:
  status: documented
  checked_at: 2026-11-25
