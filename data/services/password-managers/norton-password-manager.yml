name: Norton Password Manager
website: https://us.norton.com/feature/password-manager
description: Norton's free password manager, as browser extensions and phone apps and bundled with Norton 360. Your vault is end-to-end encrypted in Norton's cloud.
deployment: cloud
platforms: [web, android, ios, browser-extension]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/12/08/53/12085309-d5f0-8434-6fe4-157955b46562/IDSafeAppIcon-0-1x_U007emarketing-0-8-0-85-220-0.png/128x128bb.png
aliases: [Norton Identity Safe]

export:
  - id: csv
    name: Export your vault as CSV
    method: file
    formats: [norton-csv]
    requirements: [Browser extension]
    steps:
      - Unlock your vault in the browser extension, then select the extension icon and Open Web App.
      - Select Settings, then Export my vault data under My Data, and select Export.
      - Enter your vault password if it asks and select Unlock. Norton saves it as a .csv.
    data:
      included: [logins]
      excluded: [settings]
      unknown:
        [secrets, passkeys, secure-notes, cards, identities, other-items, custom-fields, groups, favourites, dates]
    limitations:
      - Norton says the file is for bringing your logins back into Norton Password Manager, and doesn't say what else is in it.
      - Nothing says your Authenticator's two-factor codes come out, so set those up in your new app before you delete anything.
      - It isn't encrypted, so delete it once you've imported it.
    docs: https://support.norton.com/sp/en/us/home/current/solutions/v5466274
    sources:
      - https://help.roboform.com/hc/en-us/articles/4420122098189

import:
  - id: managers
    name: Import another password manager's or browser's export
    method: file
    formats: [norton-csv, chrome-csv, firefox-csv, apple-passwords-csv, lastpass-csv, kaspersky-txt]
    requirements: [Browser extension]
    steps:
      - Unlock your vault in the browser extension, then select the icon in its top-right corner and Import data to my vault.
      - Pick the app or browser the file came from, select Select File and choose it, or drop it in the box.
      - Select what you want to bring in, select Import, then Finish.
    data:
      included: [logins]
      unknown:
        [
          secrets,
          passkeys,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          groups,
          favourites,
          dates
        ]
    limitations:
      - Edge, Dashlane, 1Password and McAfee True Key are on the list too.
      - For LastPass, you can also paste the export's text in, if you pick LastPass rather than LastPass (binary version).
      - Kaspersky's file only has passwords and notes.
      - Delete the file once it's in, since it isn't encrypted.
    docs: https://support.norton.com/sp/en/us/home/current/solutions/v125566479

  - id: csv
    name: Import any CSV file
    method: file
    formats: [csv]
    requirements: [Browser extension]
    steps:
      - Unlock your vault in the browser extension, then select the icon in its top-right corner and Import data to my vault.
      - Pick Any CSV file, then Select File and choose it.
      - Select Import, check the Username, website and password columns are filled in, then Import Selected.
    data:
      included: [logins]
      excluded: [secure-notes, cards, identities, other-items]
    limitations:
      - It only takes passwords, not the other things your vault can hold.
    docs: https://support.norton.com/sp/en/us/home/current/solutions/v125566479

delete:
  steps:
    - Unlock your vault in the browser extension, then select the extension icon and Open Web App.
    - Select Settings, then Delete Norton Password Manager vault under My Data, and sign in if it asks.
    - Select Reset on the Reset your Vault? screen.
  docs: https://support.norton.com/sp/en/us/home/current/solutions/v91952916
  notes:
    - Everything in the vault goes for good.
    - If you use Norton's Authenticator for two-factor codes, move them somewhere else first, or you'll be locked out of those accounts.

verification:
  status: documented
  checked_at: 2026-11-26
