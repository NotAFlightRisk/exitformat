name: Microsoft Password Manager
website: https://explore.microsoft.com/en-us/edge/features/microsoft-password-manager
description: The password manager built into Microsoft Edge. Your passwords and passkeys are kept in Edge and sync to your Microsoft account wherever you sign in.
deployment: hybrid
platforms: [windows, macos, linux, android, ios]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/02/63/54/02635443-d947-5cd6-c964-bfeeb0b85e77/AppIcon-0-0-1x_U007epad-0-0-0-1-0-0-sRGB-0-85-220.png/128x128bb.png
aliases: [Edge passwords, Microsoft Edge passwords, Edge password manager, Microsoft Wallet, Microsoft Authenticator passwords]

export:
  - id: csv
    name: Export your passwords as CSV
    method: file
    formats: [chrome-csv]
    requirements: [Edge on a computer]
    steps:
      - In Edge, select Settings and more (the three dots) or press Alt + F, then Passwords.
      - Select the three dots above your saved passwords, then Export passwords.
      - Select Export, confirm it's you if it asks, and pick where the .csv goes.
    data:
      included: [logins]
      excluded: [passkeys, cards, identities, settings]
    limitations:
      - Edge for Android and iPhone can't export, so sync your passwords to Edge on a computer first.
      - It's passwords only. Passkeys, payment cards and addresses stay behind, so add those to your new app by hand.
      - It isn't encrypted, so delete it with Shift + Delete once you've imported it.
      - The list is also under Settings --> Passwords and autofill --> Microsoft Password Manager, which needs a personal Microsoft account profile. On a work or school one, your admin may have turned it off.
    docs: https://support.microsoft.com/en-us/edge/export-passwords-in-microsoft-edge
    sources:
      - https://support.microsoft.com/en-us/edge/wallet-is-retired-in-microsoft-edge
      - https://support.microsoft.com/en-us/accounts-billing/manage/view-or-edit-your-passwords-in-microsoft-password-manager
      - https://support.1password.com/import-edge/
      - https://github.com/bitwarden/clients/blob/web-v2026.11.0/libs/importer/src/services/import.service.ts

import:
  - id: csv
    name: Import passwords from a CSV
    method: file
    formats: [chrome-csv, csv]
    requirements: [Edge on a computer]
    steps:
      - In Edge, select Settings and more (the three dots) --> Settings, then Import browser data under Profiles.
      - Under Other import locations, select Import next to Import passwords now, then pick Passwords CSV file in Import from.
      - Select Choose file, pick the .csv and select Open, then Done once it's in.
    data:
      included: [logins]
    limitations:
      - Microsoft's 2023 guide walks through files from Bitwarden, Dashlane, LastPass, 1Password, Norton, Avira and True Key, with Norton's User Name and Login URL columns renamed to username and url first.
      - Import data from Google Chrome, on the same page, brings passwords across from Chrome on the same computer with no file.
      - It isn't encrypted, so delete the file and empty the Recycle Bin once it's in.
    docs: https://support.microsoft.com/en-us/edge/import-your-favorites-and-passwords-in-microsoft-edge
    sources:
      - https://techcommunity.microsoft.com/blog/microsoftedgeinsider/importing-your-passwords-from-third-party-password-managers-to-microsoft-edge/3719162

delete:
  steps:
    - In Edge, select Settings and more (the three dots) --> Settings --> Privacy, search, and services --> Clear browsing data.
    - Select Choose what to clear, set the Time range to cover everything, tick Passwords and select Clear now.
    - To wipe Microsoft's copy, turn sync off on your other devices, turn off Passwords under Settings --> Profiles --> Sync, then Reset sync.
  docs: https://support.microsoft.com/en-us/edge/view-and-delete-browser-history-in-microsoft-edge
  notes:
    - While sync is on, clearing them removes them from every device you sync with.
    - Reset sync is under Re-sync data to this device, behind Still having sync problems? Try another option. Keep Edge open until it's done.
    - Cards and addresses are under Autofill form data in the same list, if you want those gone too.

verification:
  status: documented
  checked_at: 2026-11-26
