name: Apple Passwords
website: https://apps.apple.com/app/passwords/id6473799789
description: Apple's Passwords app on iPhone, iPad and Mac, built on iCloud Keychain, which syncs your passwords and passkeys end-to-end encrypted through iCloud.
deployment: hybrid
platforms: [ios, macos, windows, browser-extension]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/26/0b/aa/260baa30-47e3-7c3e-220f-9a3efff5728b/passwordsCalistoga-0-0-1x_U007epad-0-1-85-220.png/128x128bb.png
aliases: [Passwords app, iCloud Keychain, iCloud Passwords, Safari passwords, Keychain]

export:
  - id: csv
    name: Export your passwords as CSV
    method: file
    formats: [apple-passwords-csv]
    steps:
      - On a Mac, open Passwords and select File --> Export All Passwords to File, then Export Passwords, and save it.
      - On iPhone or iPad, go to Settings --> Apps --> Safari, tap Export below History and Website Data and pick only Passwords.
      - Tap Save to Downloads, then unzip what lands in Downloads to get the Passwords.csv.
      - On Windows, open iCloud Passwords, select two or more accounts (or Select All), then Export Passwords twice.
    data:
      included: [logins, secrets]
      excluded: [passkeys, cards, other-items, shared-vaults, history, settings]
    limitations:
      - It isn't encrypted, so delete it once you've imported it.
      - Passkeys, Wi-Fi passwords and Sign in with Apple accounts stay behind, and so do passwords someone else shared with you in a group.
      - Passwords in a group you made come out, but without the group, and none of them bring their password history.
      - Saved cards aren't in the .csv. Safari's export on iPhone can put them in the same zip, as a PaymentCards.json of their own.
      - On Windows you have to pick at least two accounts, so you can't export just one.
      - On iOS 26 and macOS 26 or later, Passwords can also hand your passwords, passkeys and codes straight to an app that supports Credential Exchange, with no file.
    docs: https://support.apple.com/guide/passwords/export-passwords-mchl35b12625/mac
    sources:
      - https://support.apple.com/guide/iphone/export-passwords-iphf28f2e93e/ios
      - https://support.apple.com/guide/iphone/export-safari-data-to-another-browser-iph1852764a6/ios
      - https://support.apple.com/guide/icloud-windows/export-passwords-icw3cb8e8853/icloud
      - https://developer.apple.com/documentation/safariservices/importing-data-exported-from-safari
      - https://support.dashlane.com/hc/en-us/articles/7964813633426

import:
  - id: csv
    name: Import passwords from a CSV
    method: file
    formats: [apple-passwords-csv]
    steps:
      - On a Mac, open Passwords, select File --> Import Passwords from File, then Choose File, pick the .csv and select Import.
      - On iPhone or iPad, go to Settings --> Apps --> Safari, tap Import, then Choose File, pick the .csv or .zip and tap Import to Safari.
      - On Windows, open iCloud Passwords, select Import Passwords from its menu, then Choose File and pick the .csv.
      - Delete the .csv once it's in, since it isn't encrypted.
    data:
      included: [logins]
      unknown: [secrets]
    limitations:
      - Passwords you've already got stay as they are, and anything that couldn't come in is listed for you to look over.
      - A .csv from another app or browser goes in the same way, but Apple doesn't say which columns it reads, so check what came across.
      - On a Mac, Safari can also bring in passwords straight from Chrome or Firefox on the same Mac, with File --> Import From Browser.
      - On iOS 26 and macOS 26 or later, apps that support Credential Exchange, like Dashlane, can hand over logins, passkeys and codes with no file. Wi-Fi items don't come across.
    docs: https://support.apple.com/guide/passwords/import-passwords-mchl2f1a184c/mac
    sources:
      - https://support.apple.com/guide/iphone/import-passwords-iph984b8ac1f/ios
      - https://support.apple.com/guide/icloud-windows/import-passwords-icwdd81d02c4/icloud
      - https://support.apple.com/guide/safari/import-bookmarks-and-passwords-ibrw1015/mac
      - https://support.dashlane.com/hc/en-us/articles/32907864739474

delete:
  steps:
    - In Passwords, select All, pick the account and select Edit.
    - Select Delete Password and confirm. On iPhone, tap Delete, then Delete Password.
  docs: https://support.apple.com/guide/passwords/remove-a-password-mchl77e2cb66/mac
  notes:
    - It goes from every device signed in to your Apple Account, but your account on the website itself stays.
    - Deleted passwords and passkeys sit in Deleted for 30 days, where you can still get them back, then they're gone for good.
    - iCloud Keychain is end-to-end encrypted, so Apple can't read what's in it.
    - To close the whole Apple Account, ask for it at privacy.apple.com. Everything tied to it goes too, for good.

verification:
  status: documented
  checked_at: 2026-11-25
