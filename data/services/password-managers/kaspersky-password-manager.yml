name: Kaspersky Password Manager
website: https://www.kaspersky.com/password-manager
description: Kaspersky's password manager for computers, phones and browsers. Your vault is encrypted with your main password and synced through your My Kaspersky account.
deployment: hybrid
platforms: [windows, macos, android, ios, web, browser-extension]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/d6/68/bc/d668bcaa-beb8-60ac-f069-d31a14648ab9/AppIcon-0-1x_U007epad-0-1-0-sRGB-0-85-220-0.png/128x128bb.png
aliases: [KPM]

export:
  - id: txt
    name: Export to a text file
    method: file
    formats: [kaspersky-txt]
    steps:
      - In the Windows app, open the application menu at the bottom of the main window, then Settings --> Import/Export.
      - Select Export under Export to text file, then choose where to save it and select OK.
      - On a Mac, it's File --> Export to TXT. On My Kaspersky, unlock Passwords, then More actions --> Export to TXT and Continue.
    data:
      included: [logins, secure-notes]
      excluded: [secrets, passkeys, cards, identities, attachments, settings]
      unknown: [groups, favourites, dates]
    limitations:
      - It only has your website, app and other accounts and your notes. Bank cards, addresses, documents, Authenticator codes and passkeys stay behind.
      - It's meant for printing, and it isn't encrypted, so delete it once you've imported it.
      - Backup copy under Import/Export saves an encrypted .edb instead, which only Kaspersky Password Manager restores.
    docs: https://support.kaspersky.com/kpm-for-windows/24.2/130515
    sources:
      - https://support.kaspersky.com/us/kpm-for-mac/250621
      - https://support.kaspersky.com/my-kaspersky/232804
      - https://github.com/ProtonMail/WebClients/blob/proton-pass@1.44.1/packages/pass/lib/import/providers/kaspersky/mocks/kaspersky.txt

  - id: csv
    name: Export to CSV on My Kaspersky
    method: file
    formats: [kaspersky-csv]
    requirements: [My Kaspersky]
    steps:
      - Sign in to My Kaspersky, go to the Passwords tab, enter your main password and select Unlock storage.
      - Select More actions in the top right, then Export to CSV.
      - Read the warning and select Continue.
    data:
      included: [logins]
      unknown:
        [
          secrets,
          passkeys,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          attachments,
          groups,
          favourites,
          dates
        ]
    limitations:
      - Kaspersky only says it holds your passwords, not which columns it has.
      - It isn't encrypted, so delete it once you've imported it.
    docs: https://support.kaspersky.com/my-kaspersky/232804

import:
  - id: managers
    name: Import another password manager's CSV
    method: file
    formats: [lastpass-csv, csv]
    requirements: [Windows app]
    steps:
      - In the Windows app, open the application menu at the bottom of the main window, then Settings --> Import/Export.
      - Select Import under Import from password managers, then choose the .csv and select Open.
    data:
      included: [logins]
      excluded:
        [
          secrets,
          passkeys,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          attachments,
          groups,
          tags,
          favourites,
          history,
          dates
        ]
    limitations:
      - It only takes website accounts, from url, username, password and name columns, and every row needs a url.
      - Kaspersky names LastPass, KeePass, Dashlane, 1Password and Norton Identity Safe, but says it can't promise everything comes across.
      - On the free version, anything past its limit comes in switched off.
      - Chrome, Firefox, Edge and Yandex Browser can be imported straight from the browser, under Import from browser on the same screen.
    docs: https://support.kaspersky.com/kpm-for-windows/24.2/130515

delete:
  steps:
    - Sign in to My Kaspersky and select your email address in the top right, then manage your account.
    - Go to the Delete account tab, select Delete, enter your password and select Delete again.
  docs: https://support.kaspersky.com/my-kaspersky/95252
  notes:
    - Cancel auto-renewal on any subscription the account manages first, or it won't let you delete it. Ones bought from a reseller keep charging unless you turn auto-renewal off there.
    - It deletes everything tied to the account and can't be undone, so export first. An account that's gone unused for 5 years is deleted anyway.

verification:
  status: documented
