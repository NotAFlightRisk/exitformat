name: Sticky Password
website: https://www.stickypassword.com/
description: Password manager for Windows, Mac and phones. Your vault stays on your devices, synced through Sticky Password's cloud or your own Wi-Fi if you like.
deployment: hybrid
platforms: [windows, macos, android, ios, browser-extension]
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/dd/d3/33/ddd3333a-4a22-5845-6628-bd2c7fb78a28/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/128x128bb.png

export:
  - id: xml
    name: Export without encryption
    method: file
    formats: [sticky-password-xml]
    requirements: [Windows or phone app]
    steps:
      - On Windows, select Menu --> Export, then Export all.
      - Pick Sticky Password 6 XML under Unencrypted (not secured) format, select Next, then choose where it goes and select Save.
      - On a phone, open Settings --> Import/Export --> Export your data, pick the items, tap Export and choose Unprotected Sticky Password file.
    data:
      included: [logins, secure-notes, identities, other-items, groups, dates]
      unknown: [passkeys, favourites, shared-vaults]
    limitations:
      - It isn't encrypted, so delete it once you've imported it.
      - The encrypted Sticky Password 7/8 database (.spdb) the export recommends is for moving into another copy of Sticky Password.
      - Sticky Password's own Mac guide only shows the encrypted export, though Enpass and Keeper say the Mac app has File --> Export --> Unencrypted too.
      - Windows can also save Sticky Password HTML or TXT.
    docs: https://www.stickypassword.com/help/export-data-sticky-password-windows-1111
    sources:
      - https://www.stickypassword.com/help/export-data-sticky-password-android-1302
      - https://www.stickypassword.com/help/export-data-sticky-password-iphone-ipad-1301
      - https://www.stickypassword.com/help/exporting-your-data-securely-on-mac-1108
      - https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.62/KeePass-2.62-Source.zip

import:
  - id: managers
    name: Import another password manager's or browser's export
    method: file
    formats:
      [
        1password-1pux,
        1password-csv,
        apple-passwords-csv,
        bitwarden-csv,
        bitwarden-json,
        chrome-csv,
        dashlane-csv,
        kaspersky-txt,
        keepass-csv,
        lastpass-csv,
        roboform-csv
      ]
    steps:
      - On Windows, select Menu --> Import --> Other password managers and applications, pick the app and select Next.
      - On a Mac, select File --> Import and pick the app.
      - On a phone, open Settings --> Import/Export --> Import your data, pick the app and tap I have the file.
      - Choose the file, then import everything or just the items you pick.
    data:
      included: [logins]
      unknown:
        [
          passkeys,
          secrets,
          secure-notes,
          cards,
          identities,
          other-items,
          custom-fields,
          attachments,
          groups,
          tags,
          shared-vaults,
          history,
          favourites,
          dates
        ]
    limitations:
      - The list differs by platform. Windows has 1Password, Dashlane, Kaspersky, KeePass, LastPass and RoboForm, the Mac guides cover 1Password, Dashlane and Safari, and the phone guides add Bitwarden and Edge.
      - On Windows, Dashlane and LastPass imports bring secure memos, identities and bookmarks as well. From Kaspersky, only logins and passwords come across.
      - KeePass has to be its KeePass CSV (1.x) export.
      - On Windows, Chrome is under Supported browsers. That list also reads Firefox's passwords and bookmarks straight from the browser, and Chrome's bookmarks if it's on the same computer.
      - On Android and iPhone, apps that support it can hand their passwords straight over instead, with no file.
    docs: https://www.stickypassword.com/help/can-i-import-my-passwords-from-another-program-on-windows-8
    sources:
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-1password-on-windows-1163
      - https://www.stickypassword.com/help/import-passwords-1password-mac-1164
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-chrome-on-windows-including-bookmarks-1166
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-dashlane-on-windows-1098
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-dashlane-on-mac-1162
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-kaspersky-password-manager-on-windows-1134
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-keepass-on-windows-1161
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-lastpass-on-windows-1101
      - https://www.stickypassword.com/help/how-to-import-your-passwords-from-roboform-on-windows-1097
      - https://www.stickypassword.com/help/importing-firefox-passwords-into-sticky-password-on-windows-1004
      - https://www.stickypassword.com/help/how-to-import-passwords-from-safari-on-mac-1148
      - https://www.stickypassword.com/help/import-passwords-as-file-sticky-password-android-1311
      - https://www.stickypassword.com/help/import-passwords-file-sticky-password-ios-1312
      - https://www.stickypassword.com/help/importing-data-on-your-android-device-1057
      - https://www.stickypassword.com/help/how-to-export-your-passwords-from-bitwarden-1204
      - https://www.stickypassword.com/help/how-to-export-your-passwords-from-kaspersky-password-manager-1206
      - https://www.stickypassword.com/help/how-to-export-your-passwords-from-microsoft-edge-1211

delete:
  steps:
    - In Sticky Password, switch sync to Sync - local or Disable sync from the sync menu at the bottom left of the main window.
    - Sign in at my.stickypassword.com, expand the menu with the arrow at the top and select Settings.
    - Under My data, select Delete all cloud data, then Delete all data.
  docs: https://www.stickypassword.com/help/how-to-delete-your-password-database-from-the-cloud-1052
  notes:
    - That deletes the copy in your StickyAccount and stops cloud sync. The data on your devices stays.

