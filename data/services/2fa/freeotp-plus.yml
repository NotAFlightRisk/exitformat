name: FreeOTP+
website: https://github.com/helloworld1/FreeOTPPlus
description: Free, open source 2FA app for Android, a fork of FreeOTP with backups, categories and icons, that keeps your codes on the phone.
deployment: local
platforms: [android]
source: https://github.com/helloworld1/FreeOTPPlus
icon: https://raw.githubusercontent.com/helloworld1/FreeOTPPlus/RELEASE-3.5/fastlane/metadata/android/en-US/images/icon.png
aliases: [freeotp plus]

export:
  - id: json
    name: Export to a JSON file
    method: file
    formats: [freeotp-plus-json]
    steps:
      - Open the menu (the three dots) and tap Export --> Export JSON format.
      - Choose where to save the file, on the phone or with a provider like Google Drive.
    data:
      included: [secrets, issuers, token-settings, hotp, steam, groups, sort-order]
      excluded: [icons, settings]
    limitations:
      - There's no password on it, so every secret is in plain text.
      - Icons you've picked yourself aren't in it.
    docs: https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/README.md
    sources:
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/legacy/ImportExportUtil.kt
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/MigrationUtil.kt
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/legacy/Token.java
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/app/src/main/res/menu/main.xml

  - id: key-uri
    name: Export to a key URI file
    method: file
    formats: [otpauth-uri]
    steps:
      - Open the menu (the three dots) and tap Export --> Export key URI format.
      - Choose where to save the file.
    data:
      included: [secrets, issuers, token-settings, hotp]
      excluded: [steam, icons, groups, settings]
      unknown: [sort-order]
    limitations:
      - There's no password on it, so every secret is in plain text.
      - Steam codes go out as TOTP links with Steam as the issuer, which Stratum reads as Steam but most apps don't, so they make the wrong codes.
    sources:
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/OtpTokenFactory.kt

import:
  - id: json
    name: Import a FreeOTP+ JSON file
    method: file
    formats: [freeotp-plus-json]
    steps:
      - Open the menu (the three dots) and tap Import --> Import JSON format.
      - Choose the file, then tap Ok on the warning.
    data:
      included: [secrets, issuers, token-settings, hotp, steam, groups, sort-order]
    limitations:
      - It writes over tokens already in the app rather than adding to them, so import it into a fresh install.
      - Tokens missing from the file's tokenOrder list, or with no label, are skipped without a word.
    docs: https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/README.md#import-notes
    sources:
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/MigrationUtil.kt
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/app/src/main/java/org/fedorahosted/freeotp/ui/MainActivity.kt

  - id: key-uri
    name: Import a list of otpauth links
    method: file
    formats: [otpauth-uri]
    steps:
      - Open the menu (the three dots) and tap Import --> Import key URI format.
      - Choose a text file with one otpauth:// link per line.
    data:
      included: [secrets, issuers, token-settings, hotp, icons]
      excluded: [steam, motp-yandex, groups, notes, favourites, sort-order]
    limitations:
      - One line it can't read stops the whole file, and that includes the otpauth://steam/ links Aegis and Ente write, and mOTP links.
      - Steam only comes across as a TOTP link with Steam as the issuer.
    sources:
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/legacy/ImportExportUtil.kt
      - https://github.com/helloworld1/FreeOTPPlus/blob/RELEASE-3.5/token-data/src/main/java/org/fedorahosted/freeotp/data/OtpTokenFactory.kt

verification:
  status: documented
  checked_at: 2026-11-21
