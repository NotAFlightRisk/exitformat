name: Microsoft Authenticator
website: https://www.microsoft.com/en-us/security/mobile-authenticator-app
description: Microsoft's 2FA app for Android and iOS. It has no export for your codes, and its backup only restores into Authenticator on the same platform.
deployment: local
platforms: [android, ios]
icon: https://play-lh.googleusercontent.com/7Qf6PPkO5HPtxkkGdI56KAXonEzgzyUvQARaDWP3dUsmwweJEHAI1oiZf6tSZn1wkSKKj7SO-eemScUh9a5k=s128
aliases: [ms authenticator, azure authenticator]

export:
  - id: root
    name: Read the app's data with root
    method: file
    formats: [microsoft-authenticator-app-data]
    requirements: [Root access, Android only]
    steps:
      - Before rooting, open Settings in Authenticator, switch on Cloud Backup and pick a personal Microsoft account to keep it in.
      - Root the phone and reinstall Authenticator. Select Restore from backup before signing in to anything, with that same account.
      - Leave Authenticator installed, so the app you're moving to can read its data off the phone.
    data:
      included: [secrets, issuers]
      excluded: [settings]
      unknown: [token-settings]
    limitations:
      - Unlocking the bootloader to root a phone wipes it, which is why Cloud Backup has to be on first.
      - Only codes that change every 30 seconds come back from the backup. Passwordless sign-in and work or school accounts have to be set up again.
      - Microsoft's sign-in approvals aren't one-time codes, so they don't come across either.
      - From January 2027, Android backups go through Google One instead of a Microsoft account.
      - Without root, the only way out is setting 2FA up again at every site with your new app.
    sources:
      - https://support.microsoft.com/en-us/authenticator/back-up-your-accounts-in-microsoft-authenticator
      - https://support.microsoft.com/en-us/authenticator/restore-account-credentials-from-microsoft-authenticator
      - https://source.android.com/docs/core/architecture/bootloader/locking_unlocking
      - https://github.com/beemdevelopment/Aegis/blob/v3.4.3/app/src/main/java/com/beemdevelopment/aegis/importers/MicrosoftAuthImporter.java

import: []

delete:
  steps:
    - Check every site works with your new app, or turn its 2FA off, before you delete anything.
    - On Android, open Settings, switch off Cloud Backup and select OK to delete the backup.
    - Remove each account from the app, then uninstall it.
  docs: https://support.microsoft.com/en-us/authenticator/back-up-your-accounts-in-microsoft-authenticator
  notes:
    - On iOS the backup is kept in your own iCloud rather than by Microsoft.
    - Uninstalling isn't enough for Microsoft accounts. Turn off verification for the old phone under two-step verification on your Account Security page, or My Apps for work or school.
    - Microsoft doesn't say how long a deleted backup hangs around.

verification:
  status: documented
  checked_at: 2026-11-21
