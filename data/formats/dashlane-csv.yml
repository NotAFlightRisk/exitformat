name: Dashlane CSV export
extensions: [.csv, .zip]
standard: false
owner: dashlane
based_on: csv
description: Dashlane's CSV export, separate .csv files for logins (with a category column and each one's one-time code), Secure Notes, payments, IDs and personal info, plus Wi-Fi networks from the Apple apps. It's zipped up when it comes from the web. None of it is encrypted.
