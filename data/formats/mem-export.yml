name: Mem Markdown export
extensions: [.zip]
standard: false
owner: mem
based_on: zip
description: The ZIP Mem's My Computer export gives you. Inside, notes/ has a Markdown file per note, collections/ has an index note per collection linking to its notes, attachments/ has your files, and export-report.md (when there is one) lists anything Mem couldn't include. Meeting transcripts come along where Mem has them, and recordings if you ask. They're ordinary files, so nothing's encrypted.
