name: Apple Passwords CSV
extensions: [.csv]
standard: false
owner: apple-passwords
based_on: csv
description: The .csv Apple's Passwords app and Safari export, with Title, URL, Username, Password, Notes and OTPAuth columns, where OTPAuth holds a one-time code as an otpauth link. Safari hands it over inside a zip. It isn't encrypted.
spec: https://developer.apple.com/documentation/safariservices/importing-data-exported-from-safari
