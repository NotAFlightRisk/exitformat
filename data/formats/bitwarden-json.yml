name: Bitwarden JSON export
extensions: [.json]
standard: false
owner: bitwarden
based_on: json
description: The unencrypted .json export from Bitwarden, with your folders and every item in plain text - logins, notes, cards, identities, SSH keys, passkeys and old passwords. Bitwarden Authenticator writes the same shape with just your codes, each an otpauth link in the item's login.totp field.
spec: https://bitwarden.com/help/condition-bitwarden-import/
