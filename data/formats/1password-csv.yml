name: 1Password CSV export
extensions: [.csv]
standard: false
owner: 1password
based_on: csv
description: The .csv from 1Password's desktop apps, with Title, Url, Username, Password, OTPAuth, Favorite, Archived, Tags and Notes columns. It only holds Login and Password items, with one website each, and one-time passwords as otpauth links. It isn't encrypted.
spec: https://support.1password.com/export/
