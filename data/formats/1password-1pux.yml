name: 1Password 1PUX export
extensions: [.1pux]
standard: false
owner: 1password
based_on: zip
description: 1Password's unencrypted export from its desktop apps, one file for each account. It's a zip with your vaults and items as JSON in export.data, plus a files folder for attachments, documents and custom icons. Passkeys aren't in it.
spec: https://support.1password.com/1pux-format/
