name: Stratum backup
extensions: [.stratum, .authpro]
standard: false
owner: stratum
based_on: json
description: The backup file from Stratum, the Android app that used to be called Authenticator Pro, holding your codes, categories, order and custom icons. It's plain JSON, or encrypted with a password. Older ones end in .authpro.
