name: mSecure CSV export
extensions: [.csv]
standard: false
owner: msecure
based_on: csv
description: mSecure's CSV export. It opens with the line mSecure6 CSV export file, then a row per record with its title and ID, template, tags (all in one cell, split by commas) and note, then each field as label, type and value split by |. It isn't encrypted.
