name: LastPass CSV export
extensions: [.csv]
standard: false
based_on: csv
owner: lastpass
description: The .csv LastPass exports, with url, username, password, totp, extra, name, grouping and fav columns, though LastPass says its own export leaves one-time codes out. Secure notes and other item types are rows with http://sn as the url and their details in extra. It isn't encrypted.
