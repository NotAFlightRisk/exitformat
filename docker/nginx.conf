map $uri $cache_control {
    default             "";
    ~^/_app/immutable/  "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # pages live at /notes/obsidian, never /notes/obsidian/, matching Cloudflare
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html $uri/index.html @category;
    }

    # /notes on its own is the notes category
    location @category {
        if (-f $document_root/categories$uri.html) {
            return 301 /categories$uri;
        }
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
